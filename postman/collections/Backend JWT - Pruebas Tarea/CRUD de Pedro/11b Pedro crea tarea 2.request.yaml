$kind: http-request
url: http://localhost:5001/api/tareas
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "descripcion": "Entregar la tarea de JWT"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenPedro}}"
scripts:
  - type: afterResponse
    code: pm.environment.set('idPedro', pm.response.json()._id);
    language: text/javascript
order: 2000
